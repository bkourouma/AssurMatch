services:
  runtime-smoke-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: assurmatch_runtime_smoke
      POSTGRES_USER: assurmatch_smoke
      POSTGRES_PASSWORD: assurmatch_smoke
    ports:
      - "${ASSURMATCH_RUNTIME_SMOKE_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assurmatch_smoke -d assurmatch_runtime_smoke"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - runtime-smoke-postgres-data:/var/lib/postgresql/data

  runtime-smoke-redis:
    image: redis:8-alpine
    ports:
      - "${ASSURMATCH_RUNTIME_SMOKE_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - runtime-smoke-redis-data:/data

volumes:
  runtime-smoke-postgres-data:
  runtime-smoke-redis-data:
