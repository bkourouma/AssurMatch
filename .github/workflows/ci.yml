# AssurMatch CI/CD
# - verify: PR + push main + manual run (typecheck, lint, test, build, prisma validate, audit, playwright source-marker)
# - secret-scan: ensure no real EMAIL_SMTP_PASS / private key shipped
# - build-images: push main + manual run - three GHCR images (assurmatch, assurmatch-public, assurmatch-backoffice)
# - deploy-preproduction: self-hosted runner deploys three containers behind Nginx.
#   Health checks cover the three surfaces.
#
# Deploying is opt-in, because the deploy job is the only one that needs the self-hosted runner
# `assurmatch-preprod`. When that runner is offline, GitHub does not fail the job: it leaves it
# queued for the 24 h maximum and then cancels it, so every merge to main ends on a cancelled run
# even though verify, secret-scan and build-images all passed. `timeout-minutes` does not help - it
# bounds execution, not queue time. Two ways to deploy, both explicit:
#
# 1. Manual: "Run workflow" on this workflow with `deploy_preproduction` ticked. Deploys the SHA of
#    the ref you select. Use this while the runner is brought back up.
# 2. Automatic on merge: set the repository variable `PREPROD_AUTO_DEPLOY` to `true`
#    (Settings > Secrets and variables > Actions > Variables). Only turn it on while the runner is
#    online, and turn it off again before taking the runner down.
#
# With the variable unset or not `true` and no manual request, a push to main builds and publishes
# the images as before and simply does not deploy. The images stay available under `sha-<commit>`,
# so a later manual run can deploy them.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_preproduction:
        description: "Deploy the built images to preproduction (needs the assurmatch-preprod runner online)"
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema backend/prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit/integration tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Prisma schema validate
        run: npx prisma validate --schema backend/prisma/schema.prisma
      - name: Audit (high)
        run: npm audit --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Web source-marker tests
        run: npm run test:web

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forbid real SMTP password in tracked files
        run: |
          node scripts/ci/secret-scan.mjs

  build-images:
    needs: [verify, secret-scan]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      SHA: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Three images from the same monorepo: API, public, back-office.
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/bkourouma/assurmatch:latest
            ghcr.io/bkourouma/assurmatch:${{ env.SHA }}
      - name: Build & push public image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/public/Dockerfile
          push: true
          tags: |
            ghcr.io/bkourouma/assurmatch-public:latest
            ghcr.io/bkourouma/assurmatch-public:${{ env.SHA }}
      - name: Build & push back-office image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ghcr.io/bkourouma/assurmatch-backoffice:latest
            ghcr.io/bkourouma/assurmatch-backoffice:${{ env.SHA }}

  deploy-preproduction:
    needs: build-images
    # Never queue for a runner nobody asked for: an offline assurmatch-preprod would hold this job
    # for 24 h and then cancel the whole run. See the header comment for the two ways to opt in.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_preproduction)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PREPROD_AUTO_DEPLOY == 'true')
    runs-on: [self-hosted, assurmatch-preprod]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_ENV_FILE: /home/deployer/apps/assurmatch/.env.production
      DEPLOY_NETWORK_NAME: ${{ vars.DEPLOY_NETWORK_NAME }}
      SHA: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Deploy local containers (three containers, health checks, prune)
        run: |
          set -euo pipefail
          sh ./scripts/preprod/pre-deploy-check.sh

          DEPLOY_NETWORK_NAME="${DEPLOY_NETWORK_NAME:-assurmatch-preprod}"
          NETWORK_FLAG=""
          if [ -n "${DEPLOY_NETWORK_NAME:-}" ]; then
            NETWORK_FLAG="--network ${DEPLOY_NETWORK_NAME}"
          fi

          for IMG in assurmatch assurmatch-public assurmatch-backoffice; do
            docker pull "ghcr.io/bkourouma/${IMG}:${SHA}"
          done

          docker stop assurmatch-app || true
          docker rm assurmatch-app || true
          docker run -d \
            --name assurmatch-app --restart unless-stopped \
            --env-file "${DEPLOY_ENV_FILE}" \
            -p 127.0.0.1:3600:3600 \
            -v /home/deployer/apps/assurmatch/uploads:/app/uploads \
            -v /home/deployer/apps/assurmatch/data:/app/data \
            $NETWORK_FLAG \
            "ghcr.io/bkourouma/assurmatch:${SHA}"

          docker stop assurmatch-public || true
          docker rm assurmatch-public || true
          docker run -d \
            --name assurmatch-public --restart unless-stopped \
            --env-file "${DEPLOY_ENV_FILE}" \
            -p 127.0.0.1:3601:3601 \
            $NETWORK_FLAG \
            "ghcr.io/bkourouma/assurmatch-public:${SHA}"

          docker stop assurmatch-backoffice || true
          docker rm assurmatch-backoffice || true
          docker run -d \
            --name assurmatch-backoffice --restart unless-stopped \
            --env-file "${DEPLOY_ENV_FILE}" \
            -p 127.0.0.1:3602:3602 \
            $NETWORK_FLAG \
            "ghcr.io/bkourouma/assurmatch-backoffice:${SHA}"

          for surface in "127.0.0.1:3600/countries" "127.0.0.1:3601" "127.0.0.1:3602"; do
            ok=0
            for i in $(seq 1 40); do
              if curl -fsS "http://${surface}" > /dev/null; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Health check failed for $surface"
              exit 1
            fi
          done

          docker image prune -f

  # A skipped job is easy to miss in the run graph. Say out loud that the images exist but that
  # preproduction was not updated, and how to update it.
  preproduction-deploy-skipped:
    needs: build-images
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.PREPROD_AUTO_DEPLOY != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report that preproduction was not deployed
        run: |
          echo "::notice::Images sha-${{ github.sha }} published to GHCR, preproduction NOT deployed (PREPROD_AUTO_DEPLOY is not 'true'). To deploy, run this workflow manually with deploy_preproduction ticked, once the assurmatch-preprod runner is online."
