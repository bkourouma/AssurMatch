# AssurMatch CI/CD
# - verify: PR + push main + manual run (typecheck, lint, test, build, prisma validate, audit, playwright source-marker)
# - secret-scan: gitleaks-like scan of tracked files (keys, provider tokens, credential URLs, literal secrets; spec 058)
# - build-images: push main + manual run - four GHCR images (assurmatch, assurmatch-public,
#   assurmatch-backoffice, assurmatch-broker). The three frontends are the preproduction ones: their
#   NEXT_PUBLIC_* come from the repository variables PREPROD_API_URL, PREPROD_PUBLIC_URL and
#   PREPROD_BROKER_URL (an unset variable leaves the app fallback, see scripts/ops/next-build.sh).
# - deploy-preproduction: the self-hosted runner `assurmatch-preprod`, installed on the Alliance VPS
#   (147.93.44.169) like the other applications hosted there, runs scripts/preprod/deploy.sh:
#   docker-compose.preprod-vps.yml (API, worker, public, back-office, broker, PostgreSQL, Redis,
#   Mailpit), backup, prisma migrate deploy, swap, health checks, rollback on failure.
#   verify-preproduction then checks the public URLs (https://assurmatch.allianceconsultants.net...).
#   Runbook: docs/runbooks/deployment.md.
# - build-production-frontends + deploy-production (spec 057): manual only, see the bottom of file.
#
# Deploying is opt-in, because the deploy job is the only one that needs the self-hosted runner
# `assurmatch-preprod`. When that runner is offline, GitHub does not fail the job: it leaves it
# queued for the 24 h maximum and then cancels it, so every merge to main ends on a cancelled run
# even though verify, secret-scan and build-images all passed. `timeout-minutes` does not help - it
# bounds execution, not queue time. Two ways to deploy, both explicit:
#
# 1. Manual: "Run workflow" on this workflow with `deploy_preproduction` ticked. Deploys the SHA of
#    the ref you select. Use this while the runner is brought back up.
# 2. Automatic on merge: set the repository variable `PREPROD_AUTO_DEPLOY` to `true`
#    (Settings > Secrets and variables > Actions > Variables). Only turn it on while the runner is
#    online, and turn it off again before taking the runner down.
#
# With the variable unset or not `true` and no manual request, a push to main builds and publishes
# the images as before and simply does not deploy. The images stay available under `sha-<commit>`,
# so a later manual run can deploy them.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_preproduction:
        description: "Deploy the built images to preproduction (needs the assurmatch-preprod runner online)"
        type: boolean
        default: false
      deploy_production:
        description: "Deploy to PRODUCTION (needs approval of the production environment and the assurmatch-production runner)"
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema backend/prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit/integration tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Prisma schema validate
        run: npx prisma validate --schema backend/prisma/schema.prisma
      - name: Audit (high)
        run: npm audit --audit-level=high
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Web source-marker tests
        run: npm run test:web

  # Spec 059 (PRD M-01 / M-03): end-to-end business journeys on a blank Docker stack built from the
  # production Dockerfiles (docker-compose.e2e.yml): reference seed + first Super Admin only, then
  # SC-01 -> SC-07, the SC-09 forbidden cases and the visitor tracking journeys through the three
  # apps, e-mails read in Mailpit. Traces, videos, screenshots, the HTML report and the container
  # logs are kept on failure. The load test runs afterwards on the same stack and never fails the job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      # The load test spreads its synthetic visitors over X-Forwarded-For (one trusted hop, as
      # behind nginx in production); the browsers of the journeys never send that header.
      ASSURMATCH_E2E_TRUSTED_PROXY_HOPS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space for the four images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema backend/prisma/schema.prisma
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Journeys on a blank stack (build, migrate, reference seed, first Super Admin, Playwright)
        run: npm run test:e2e:stack -- --keep
      - name: Load test (non-blocking, 50 req/s, p95 < 800 ms)
        if: always()
        continue-on-error: true
        run: npm run test:load -- --forwarded-for --report-only
      - name: Tear the stack down
        if: always()
        run: npm run test:e2e:stack -- --down
      - name: Upload Playwright traces, videos and report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright
          path: |
            test-results/e2e
            playwright-report/e2e
          retention-days: 14
      - name: Upload stack logs and load report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-stack-logs
          path: |
            .local/e2e/logs
            .local/e2e/load-report.json
          retention-days: 14
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan tracked files for secrets (spec 058 FR-008)
        run: |
          node scripts/ci/secret-scan.mjs

  build-images:
    needs: [verify, secret-scan]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      SHA: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check the preproduction frontend URL variables
        env:
          PREPROD_API_URL: ${{ vars.PREPROD_API_URL }}
          PREPROD_PUBLIC_URL: ${{ vars.PREPROD_PUBLIC_URL }}
          PREPROD_BROKER_URL: ${{ vars.PREPROD_BROKER_URL }}
        run: |
          for name in PREPROD_API_URL PREPROD_PUBLIC_URL PREPROD_BROKER_URL; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "::warning::Repository variable $name is not set: the frontend images keep their local fallback URL (Settings > Secrets and variables > Actions > Variables)"
            fi
          done

      # API, public, back-office and broker images from the same monorepo.
      - name: Build & push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/bkourouma/assurmatch:latest
            ghcr.io/bkourouma/assurmatch:${{ env.SHA }}
      - name: Build & push public image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/public/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_ASSURMATCH_API_URL=${{ vars.PREPROD_API_URL }}
            NEXT_PUBLIC_ASSURMATCH_PUBLIC_URL=${{ vars.PREPROD_PUBLIC_URL }}
            NEXT_PUBLIC_ASSURMATCH_BROKER_URL=${{ vars.PREPROD_BROKER_URL }}
            NEXT_PUBLIC_APP_ENV=preproduction
          tags: |
            ghcr.io/bkourouma/assurmatch-public:latest
            ghcr.io/bkourouma/assurmatch-public:${{ env.SHA }}
      - name: Build & push back-office image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_ASSURMATCH_API_URL=${{ vars.PREPROD_API_URL }}
            NEXT_PUBLIC_ASSURMATCH_ADMIN_API_URL=${{ vars.PREPROD_API_URL }}
            NEXT_PUBLIC_APP_ENV=preproduction
          tags: |
            ghcr.io/bkourouma/assurmatch-backoffice:latest
            ghcr.io/bkourouma/assurmatch-backoffice:${{ env.SHA }}
      - name: Build & push broker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/broker/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_ASSURMATCH_API_URL=${{ vars.PREPROD_API_URL }}
            NEXT_PUBLIC_ASSURMATCH_BROKER_API_URL=${{ vars.PREPROD_API_URL }}
            NEXT_PUBLIC_APP_ENV=preproduction
          tags: |
            ghcr.io/bkourouma/assurmatch-broker:latest
            ghcr.io/bkourouma/assurmatch-broker:${{ env.SHA }}

  deploy-preproduction:
    needs: build-images
    # Never queue for a runner nobody asked for: an offline assurmatch-preprod would hold this job
    # for 24 h and then cancel the whole run. See the header comment for the two ways to opt in.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_preproduction)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PREPROD_AUTO_DEPLOY == 'true')
    # Runner installed on the Alliance VPS itself (user deployer, label assurmatch-preprod): the steps
    # run on the server, like the other applications hosted there. Never reached from a pull request.
    runs-on: [self-hosted, assurmatch-preprod]
    # Two deployments at once would fight over the same containers, volumes and database.
    concurrency:
      group: deploy-preproduction
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      ASSURMATCH_IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # docker-compose.preprod-vps.yml: api, worker, public, admin, broker + postgres, redis, mailpit.
      - name: Check, pull, back up, migrate, swap, health-check (rollback on failure)
        run: sh ./scripts/preprod/deploy.sh
      # The token is short-lived, but no GHCR login must stay on the shared server.
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true
      - name: Report
        if: always()
        run: |
          echo "### Preproduction deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Images: \`${ASSURMATCH_IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  # Seen from outside (DNS, nginx, certificates). The stack is already healthy on the server: a
  # failure here rolls nothing back, it points at nginx, DNS or TLS.
  verify-preproduction:
    needs: deploy-preproduction
    runs-on: ubuntu-latest
    # Four URLs x 10 tries x (10 s timeout + 6 s pause) in the worst case: enough room for the job
    # to print which URL failed instead of being cancelled.
    timeout-minutes: 12
    env:
      API_URL: ${{ vars.PREPROD_API_URL }}
      PUBLIC_URL: ${{ vars.PREPROD_PUBLIC_URL }}
      ADMIN_URL: ${{ vars.PREPROD_ADMIN_URL }}
      BROKER_URL: ${{ vars.PREPROD_BROKER_URL }}
    steps:
      - name: Check the public URLs
        run: |
          check() { # url label
            for i in $(seq 1 10); do
              if curl -fsS --max-time 10 -o /dev/null "$1"; then echo "ok  $2  $1"; return 0; fi
              sleep 6
            done
            return 1
          }
          failed=0
          [ -z "$API_URL" ] || check "$API_URL/readyz" api || { echo "::error::$API_URL/readyz does not answer"; failed=1; }
          [ -z "$PUBLIC_URL" ] || check "$PUBLIC_URL/" public || { echo "::error::$PUBLIC_URL does not answer"; failed=1; }
          [ -z "$ADMIN_URL" ] || check "$ADMIN_URL/login" admin || { echo "::error::$ADMIN_URL/login does not answer"; failed=1; }
          # The broker host name is served only once its DNS record and certificate exist
          # (deploy/nginx/assurmatch-preprod-broker.conf): a warning until then.
          [ -z "$BROKER_URL" ] || check "$BROKER_URL/login" broker || echo "::warning::$BROKER_URL/login does not answer (DNS record, certificate or nginx vhost missing?)"
          exit "$failed"

  # A skipped job is easy to miss in the run graph. Say out loud that the images exist but that
  # preproduction was not updated, and how to update it.
  preproduction-deploy-skipped:
    needs: build-images
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.PREPROD_AUTO_DEPLOY != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report that preproduction was not deployed
        run: |
          echo "::notice::Images sha-${{ github.sha }} published to GHCR, preproduction NOT deployed (PREPROD_AUTO_DEPLOY is not 'true'). To deploy, run this workflow manually with deploy_preproduction ticked, once the assurmatch-preprod runner is online."

  # --- Production (spec 057, PRD K-01 / K-02 / K-04) ---------------------------------------------
  # Manual only: "Run workflow" with `deploy_production` ticked. Never on push.
  #
  # Next.js compiles NEXT_PUBLIC_* into the frontend bundles, so production frontends are built here
  # with the production URLs, from repository variables (not secrets - they are public):
  #   PROD_API_URL     e.g. https://api.<domain>
  #   PROD_PUBLIC_URL  e.g. https://<domain>
  #   PROD_BROKER_URL  e.g. https://pro.<domain>
  # The API/worker image is the environment-independent `sha-<commit>` image from build-images.
  build-production-frontends:
    needs: build-images
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: public
            image: assurmatch-public
            file: apps/public/Dockerfile
          - app: admin
            image: assurmatch-backoffice
            file: apps/admin/Dockerfile
          - app: broker
            image: assurmatch-broker
            file: apps/broker/Dockerfile
    env:
      TAG: production-sha-${{ github.sha }}
    steps:
      - name: Require the production URL variables
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          PROD_PUBLIC_URL: ${{ vars.PROD_PUBLIC_URL }}
          PROD_BROKER_URL: ${{ vars.PROD_BROKER_URL }}
        run: |
          missing=""
          for name in PROD_API_URL PROD_PUBLIC_URL PROD_BROKER_URL; do
            eval "value=\${$name:-}"
            case "$value" in https://*) ;; *) missing="$missing $name" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository variables missing or not https:$missing (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build & push production ${{ matrix.app }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            NEXT_PUBLIC_ASSURMATCH_API_URL=${{ vars.PROD_API_URL }}
            NEXT_PUBLIC_ASSURMATCH_ADMIN_API_URL=${{ vars.PROD_API_URL }}
            NEXT_PUBLIC_ASSURMATCH_BROKER_API_URL=${{ vars.PROD_API_URL }}
            NEXT_PUBLIC_ASSURMATCH_PUBLIC_URL=${{ vars.PROD_PUBLIC_URL }}
            NEXT_PUBLIC_ASSURMATCH_BROKER_URL=${{ vars.PROD_BROKER_URL }}
            NEXT_PUBLIC_APP_ENV=production
            REQUIRE_NEXT_PUBLIC=NEXT_PUBLIC_ASSURMATCH_API_URL
          tags: ghcr.io/bkourouma/${{ matrix.image }}:${{ env.TAG }}

  deploy-production:
    needs: [build-images, build-production-frontends]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    # The GitHub Environment `production` must require reviewers: the job waits for a human
    # approval before it is even sent to the runner (Settings > Environments > production).
    environment:
      name: production
      url: ${{ vars.PROD_PUBLIC_URL }}
    # Dedicated runner on the production host, label `assurmatch-production`
    # (docs/runbooks/deployment-production.md). Never the preproduction runner.
    runs-on: [self-hosted, assurmatch-production]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      ASSURMATCH_IMAGE_TAG: sha-${{ github.sha }}
      ASSURMATCH_FRONTEND_TAG: production-sha-${{ github.sha }}
      ASSURMATCH_ENV_DIR: /home/deployer/apps/assurmatch/env
      ASSURMATCH_DEPLOY_STATE_FILE: /home/deployer/apps/assurmatch/deployed.env
      COMPOSE_PROFILES: ${{ vars.PROD_COMPOSE_PROFILES }}
    steps:
      - uses: actions/checkout@v7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check, pull, migrate, swap, health-check
        run: sh ./scripts/production/deploy.sh
      - name: Report
        if: always()
        run: |
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- API/worker: \`${ASSURMATCH_IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontends: \`${ASSURMATCH_FRONTEND_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
