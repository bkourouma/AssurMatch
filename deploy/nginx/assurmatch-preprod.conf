# AssurMatch PREPRODUCTION reverse proxy on the Alliance VPS (host nginx 1.24, http { } context).
# Public site, platform back-office and API. The broker back-office has its own file
# (assurmatch-preprod-broker.conf) so it can be enabled once its DNS record and certificate exist.
#
#   assurmatch.allianceconsultants.net             Web Publique Client      127.0.0.1:3601
#   backoffice-assurmatch.allianceconsultants.net  Back-office Plateforme   127.0.0.1:3602
#   api-assurmatch.allianceconsultants.net         Backend API              127.0.0.1:3600
#
# Install (docs/runbooks/deployment.md, "Host preparation"):
#   sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/assurmatch-security-headers.conf
#   sudo cp deploy/nginx/assurmatch-preprod.conf /etc/nginx/sites-available/assurmatch-preprod
#   sudo ln -sfn /etc/nginx/sites-available/assurmatch-preprod /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certificates: certbot webroot (/var/www/html), one per host name, renewed by the certbot timer.
# Same rules as the production template (spec 058): versioned security headers, per-IP rate limiting
# of authentication POSTs, /metrics never public, X-Robots-Tag noindex everywhere (preproduction).

# --- Header fallbacks (used by security-headers.conf) -------------------------------------------
map $upstream_http_content_security_policy $assurmatch_csp {
    ""      "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    default $upstream_http_content_security_policy;
}
map $upstream_http_referrer_policy $assurmatch_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default $upstream_http_referrer_policy;
}

# --- Rate limiting (per real client IP, POST only) ----------------------------------------------
map $request_method $assurmatch_auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $assurmatch_auth_limit_key zone=assurmatch_auth:10m rate=10r/m;

upstream assurmatch_api    { server 127.0.0.1:3600; }
upstream assurmatch_public { server 127.0.0.1:3601; }
upstream assurmatch_admin  { server 127.0.0.1:3602; }
upstream assurmatch_broker { server 127.0.0.1:3603; }

server {
    listen 80;
    listen [::]:80;
    server_name assurmatch.allianceconsultants.net backoffice-assurmatch.allianceconsultants.net api-assurmatch.allianceconsultants.net;
    # Left open over HTTP: certbot issues and renews through the webroot.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- Public -----------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name assurmatch.allianceconsultants.net;
    ssl_certificate     /etc/letsencrypt/live/assurmatch.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assurmatch.allianceconsultants.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log /var/log/nginx/assurmatch-preprod-public.access.log;
    error_log  /var/log/nginx/assurmatch-preprod-public.error.log;
    include /etc/nginx/snippets/assurmatch-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://assurmatch_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Back-office Plateforme -------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backoffice-assurmatch.allianceconsultants.net;
    ssl_certificate     /etc/letsencrypt/live/backoffice-assurmatch.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backoffice-assurmatch.allianceconsultants.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log /var/log/nginx/assurmatch-preprod-admin.access.log;
    error_log  /var/log/nginx/assurmatch-preprod-admin.error.log;
    include /etc/nginx/snippets/assurmatch-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Login, MFA, activation and password reset forms post to the app (server actions).
    location ~ ^/(login|mfa|activate|password-reset) {
        limit_req zone=assurmatch_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://assurmatch_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://assurmatch_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API --------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-assurmatch.allianceconsultants.net;
    ssl_certificate     /etc/letsencrypt/live/api-assurmatch.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-assurmatch.allianceconsultants.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log /var/log/nginx/assurmatch-preprod-api.access.log;
    error_log  /var/log/nginx/assurmatch-preprod-api.error.log;
    include /etc/nginx/snippets/assurmatch-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 12m;

    # Spec 058 FR-003: metrics are never served publicly.
    location = /metrics { return 404; }

    location ^~ /auth/ {
        limit_req zone=assurmatch_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://assurmatch_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://assurmatch_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
