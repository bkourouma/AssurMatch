# AssurMatch security headers — versioned (spec 058 FR-007). Include inside each `server { }` block of
# the four AssurMatch vhosts, AFTER the `map` blocks of assurmatch-production.conf.example are loaded
# (http context):
#
#     include /etc/nginx/snippets/assurmatch-security-headers.conf;
#
# Copy: sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/assurmatch-security-headers.conf
#
# The Next apps already send the same set (packages/shared/security/security-headers.ts). nginx hides
# the upstream copy and re-adds ONE value, so a header is never duplicated and is also present on
# nginx-generated responses (502/504 pages, redirects):
#   - HSTS, X-Frame-Options, X-Content-Type-Options, Permissions-Policy: fixed values, nginx wins.
#   - Content-Security-Policy and Referrer-Policy: the app's value wins when it sends one (per-app
#     connect-src; `no-referrer` on the public visitor token pages, spec 054 R8); otherwise the strict
#     fallback from the maps ($assurmatch_csp, $assurmatch_referrer_policy).
# Never add another `add_header` inside a `location` of these vhosts: nginx would then drop every
# header declared here for that location (add_header inheritance rule).

proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Powered-By;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy $assurmatch_csp always;
add_header Referrer-Policy $assurmatch_referrer_policy always;
