# AssurMatch PREPRODUCTION — Broker Back-office (127.0.0.1:3603), host nginx on the Alliance VPS.
# Needs assurmatch-preprod.conf (upstream assurmatch_broker, rate-limit zone, header maps).
# Enable only once pro-assurmatch.allianceconsultants.net resolves to the VPS and its certificate exists:
#   sudo cp deploy/nginx/assurmatch-preprod-broker.conf /etc/nginx/sites-available/assurmatch-preprod-broker
#   sudo ln -sfn /etc/nginx/sites-available/assurmatch-preprod-broker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name pro-assurmatch.allianceconsultants.net;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pro-assurmatch.allianceconsultants.net;
    ssl_certificate     /etc/letsencrypt/live/pro-assurmatch.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pro-assurmatch.allianceconsultants.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log /var/log/nginx/assurmatch-preprod-broker.access.log;
    error_log  /var/log/nginx/assurmatch-preprod-broker.error.log;
    include /etc/nginx/snippets/assurmatch-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/(login|mfa|activate|password-reset) {
        limit_req zone=assurmatch_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://assurmatch_broker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://assurmatch_broker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
