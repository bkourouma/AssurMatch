# Docker Desktop (Windows / macOS) override of docker-compose.e2e.yml, for `--apps=host` runs.
# Host networking is not reachable from the host there, so the three infrastructure services publish
# their ports instead (same numbers as the Linux host-network stack). The apps run as host processes
# (`npm run test:e2e:stack -- --apps=host`), so they reach the infrastructure on 127.0.0.1.
#   ASSURMATCH_E2E_COMPOSE_OVERRIDE=docker-compose.e2e.desktop.yml npm run test:e2e:stack -- --apps=host
services:
  postgres:
    network_mode: !reset null
    ports: !override
      - "127.0.0.1:${ASSURMATCH_E2E_POSTGRES_PORT:-48632}:${ASSURMATCH_E2E_POSTGRES_PORT:-48632}"
    command: ["postgres", "-p", "${ASSURMATCH_E2E_POSTGRES_PORT:-48632}", "-c", "listen_addresses=*", "-c", "fsync=off"]
  redis:
    network_mode: !reset null
    ports: !override
      - "127.0.0.1:${ASSURMATCH_E2E_REDIS_PORT:-48679}:${ASSURMATCH_E2E_REDIS_PORT:-48679}"
    command: ["redis-server", "--port", "${ASSURMATCH_E2E_REDIS_PORT:-48679}", "--bind", "0.0.0.0", "--save", ""]
  mailpit:
    network_mode: !reset null
    ports: !override
      - "127.0.0.1:${ASSURMATCH_E2E_MAILPIT_SMTP_PORT:-48025}:${ASSURMATCH_E2E_MAILPIT_SMTP_PORT:-48025}"
      - "127.0.0.1:${ASSURMATCH_E2E_MAILPIT_HTTP_PORT:-48825}:${ASSURMATCH_E2E_MAILPIT_HTTP_PORT:-48825}"
    environment: !override
      MP_SMTP_BIND_ADDR: 0.0.0.0:${ASSURMATCH_E2E_MAILPIT_SMTP_PORT:-48025}
      MP_UI_BIND_ADDR: 0.0.0.0:${ASSURMATCH_E2E_MAILPIT_HTTP_PORT:-48825}
      MP_MAX_MESSAGES: "2000"
